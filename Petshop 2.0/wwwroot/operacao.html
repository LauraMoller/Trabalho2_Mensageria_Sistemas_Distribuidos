<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operação · Pet Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
  <div class="container">
    <span class="navbar-brand fw-bold">🐾 Pet Shop · Banho e Tosa</span>
    <ul class="navbar-nav me-auto">
      <li class="nav-item"><a class="nav-link " href="index.html">Recepção</a></li>
      <li class="nav-item"><a class="nav-link active" href="operacao.html">Operação</a></li>
    </ul>
    <span id="conexao" class="badge text-bg-secondary">conectando...</span>
  </div>
</nav>

<main class="container pb-5">
  <h1 class="h3 mb-3">Módulo da Operação</h1>

  <div class="row g-3 mb-4">
    <div class="col-lg-8">
      <div class="card shadow-sm h-100">
        <div class="card-header fw-semibold">Lista de banho/tosa <span class="text-body-secondary fw-normal small">(fila.operacional.checkin)</span></div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead><tr><th>#</th><th>Pet</th><th>Status</th><th class="text-end">Ação</th></tr></thead>
            <tbody id="tabela"><tr><td colspan="4" class="text-center text-body-secondary py-4">Aguardando check-ins da recepção.</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="card shadow-sm text-center">
        <div class="card-body">
          <div class="display-6 text-danger" id="dlq">0</div>
          <div class="text-body-secondary small">mensagens enviadas à DLQ (<code>fila.notificacao.dlq</code>)</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-header fw-semibold">Log de eventos</div>
    <ul id="log" class="list-group list-group-flush overflow-auto" style="max-height: 280px"></ul>
  </div>
</main>

<script src="js/app.js"></script>
<script>
  const tabela = document.getElementById('tabela');

  function render() {
    const lista = [...pets.values()].reverse()
      .filter(p => painelOperacional.has(p.petId) && p.evento !== 'CheckOutRealizado');
    if (!lista.length) return;
    tabela.innerHTML = lista.map(p => {
      const [txt, cor] = STATUS[p.evento];
      const dados = `data-id="${esc(p.petId)}" data-nome="${esc(p.nome)}" data-email="${esc(p.email)}"`;
      let acao = '';
      if (p.evento === 'CheckInRealizado')
        acao = `<button class="btn btn-sm btn-primary" data-acao="iniciar" ${dados}>Iniciar serviço</button>`;
      else if (p.evento === 'ServicoIniciado')
        acao = `<button class="btn btn-sm btn-success" data-acao="finalizar" ${dados}>Finalizar serviço</button>`;
      return `<tr><td>#${esc(p.petId)}</td><td>${esc(p.nome)}<div class="small text-body-secondary">${esc(p.email)}</div></td>
        <td><span class="badge text-bg-${cor}">${txt}</span></td><td class="text-end">${acao}</td></tr>`;
    }).join('');
  }

  tabela.onclick = ev => {
    const b = ev.target.closest('button');
    if (b) post('/api/' + b.dataset.acao, { petId: b.dataset.id, nomePet: b.dataset.nome, emailTutor: b.dataset.email });
  };

  conectar(render);
</script>
</body>
</html>
